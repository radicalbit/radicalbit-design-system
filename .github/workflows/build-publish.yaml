name: build-push

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
    - "main"
  pull_request:
    branches:
    - "*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: yarn install
      - run: yarn less-check
      - run: yarn eslint-check
      - run: npm publish --access public
        if: startsWith(github.ref, 'refs/tags/v')
