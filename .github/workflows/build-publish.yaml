name: build-push

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
    - "main"
  pull_request:
    branches:
    - "*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: yarn install
      - run: yarn less-check
      - run: yarn eslint-check
      - run: rm -f ~/.npmrc
      - uses: JS-DevTools/npm-publish@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          access: public
